name: Diagnose data sources
# Probes the official servers from a GitHub runner and commits diagnostics/probe.json. Read-only against the sources.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python tools/probe_sources.py
      - name: Commit diagnostics
        run: |
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f diagnostics/probe.json
          git commit -m "Diagnostics" || echo "nothing to commit"
          git pull --rebase || true
          git push
