name: Publish site
# Publishes the web/ folder to GitHub Pages after every data build / live refresh / change to web/.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: ["Build SHAILDHARA data (manual)", "Refresh live data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
