          PATCH_END
          if git apply --check /tmp/fixes.patch 2>/dev/null; then
            git apply /tmp/fixes.patch; echo "Applied code update level $LEVEL."
          elif git apply --check -R /tmp/fixes.patch 2>/dev/null; then
            echo "Code update was already present; recording level $LEVEL."
          else
            echo "::error::The embedded code update does not apply to this version of the repository. Nothing was changed."; exit 1
          fi
          echo "$LEVEL" > .shaildhara_patch_level
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A -- config pipeline tests web/app.js web/chain.js web/index.html web/style.css requirements-live.txt .shaildhara_patch_level
          git commit -m "Apply SHAILDHARA code update level $LEVEL" || echo "nothing to commit"
          git pull --rebase || true
          git push
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-live.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: shaildhara-cache-${{ github.run_id }}
          restore-keys: shaildhara-cache-
      - name: Refresh live feeds only
        timeout-minutes: 22
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          SHAILDHARA_CONTACT: ${{ vars.SHAILDHARA_CONTACT }}
        run: python -m pipeline.build_all --live
      - name: Rebuild coverage audit
        run: python -m pipeline.build_coverage
      - name: Commit data
        run: |
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f web/data/live web/data/build_status.json web/data/sources.json web/data/coverage.json || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Refresh live data"
          git pull --rebase || true
          git push
      - name: Report source status (fails only if BOTH critical feeds failed)
        run: |
          python - <<'PY'
          import json, os, sys
          s = json.load(open("web/data/live/status.json"))["sources"]
          ok = lambda k: s.get(k, {}).get("status") in ("OK", "NO_CURRENT_ALERTS")
          lines = ["| source | status | records | newest data |", "|---|---|---|---|"]
          for k, v in s.items():
              lines.append(f"| {k} | {v.get('status')} | {v.get('records')} | {v.get('data_date')} |")
              if v.get("status") not in ("OK", "NO_CURRENT_ALERTS", "DISABLED"):
                  print(f"::warning title={k}::{k} is {v.get('status')}: {(v.get('detail') or '')[:200]}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n\nA green run means the pipeline ran; check this table for which feeds returned fresh data.\n")
          if not ok("sachet") and not ok("nwdp_cwc"):
              print("::error::Both critical feeds (SACHET alerts and CWC/NWDP) failed. Last good data was kept and is marked blocked on the site.")
              sys.exit(1)
          PY
