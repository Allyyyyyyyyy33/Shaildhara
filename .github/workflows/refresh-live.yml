name: Refresh live data
# Runs every 3 hours AFTER the static build has been committed once. Only the live sources are refreshed.
# If the sources refuse GitHub's servers, the status file says so and the site shows "No current data" - nothing is invented.
on:
  schedule: [{ cron: "15 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Refresh
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          SHAILDHARA_CONTACT: ${{ vars.SHAILDHARA_CONTACT }}
        run: python -m pipeline.build_all --live
      - name: Commit
        run: |
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f web/data/live web/data/build_status.json web/data/sources.json || true
          git commit -m "Refresh live data" || echo "nothing to commit"
          git push
