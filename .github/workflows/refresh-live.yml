name: Refresh live data
# Every 3 hours: re-reads the live official sources (SACHET alerts, CWC/NWDP station data, IMD if a key is set), rebuilds the
# small coverage audit, and commits web/data. Live feeds only - this never rebuilds the large static data. A failed source keeps
# its last good data (marked blocked), and publishing runs afterwards (pages.yml).
#
# VERSIONED SELF-UPDATE: the first run applies the tested SHAILDHARA code update embedded below, records it in
# .shaildhara_patch_level, and does nothing on every later run. If the code is already updated it only records the level.
on:
  schedule: [{ cron: "15 */3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-live.yml"]
permissions:
  contents: write
concurrency: shaildhara-live
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Apply SHAILDHARA code update (versioned, one time)
        run: |
          LEVEL=4
          CUR=$(cat .shaildhara_patch_level 2>/dev/null || echo 0)
          if [ "$CUR" -ge "$LEVEL" ]; then echo "Code update level $CUR already applied - nothing to do."; exit 0; fi
          base64 -d <<'PATCH_END' | gunzip > /tmp/fixes.patch
