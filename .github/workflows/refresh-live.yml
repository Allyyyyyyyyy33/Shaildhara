name: Refresh live data
# Every 3 hours: re-reads the live official sources (alerts, telemetry, IMD if a key is set) and commits web/data/live.
# Needs web/data built once. Cached ETags/CAP files keep requests polite (NDMA asks consumers to honour ETags).
on:
  schedule: [{ cron: "15 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: shaildhara-live
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: shaildhara-cache-${{ github.run_id }}
          restore-keys: shaildhara-cache-
      - name: Refresh
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          SHAILDHARA_CONTACT: ${{ vars.SHAILDHARA_CONTACT }}
        run: python -m pipeline.build_all --live
      - name: Commit
        run: |
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f web/data/live web/data/build_status.json web/data/sources.json || true
          git commit -m "Refresh live data" || echo "nothing to commit"
          git pull --rebase || true
          git push
