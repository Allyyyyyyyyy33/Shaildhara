          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A -- config pipeline tests web/app.js web/chain.js requirements-live.txt
          git commit -m "Apply SHAILDHARA fixes: live-refresh time budgets, startup crash fix, expired alerts hidden"
          git pull --rebase || true
          git push
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-live.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: shaildhara-cache-${{ github.run_id }}
          restore-keys: shaildhara-cache-
      - name: Refresh live feeds only
        timeout-minutes: 22
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          SHAILDHARA_CONTACT: ${{ vars.SHAILDHARA_CONTACT }}
        run: python -m pipeline.build_all --live
      - name: Commit
        run: |
          git config user.name "shaildhara-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f web/data/live web/data/build_status.json web/data/sources.json || true
          git commit -m "Refresh live data" || echo "nothing to commit"
          git pull --rebase || true
          git push
