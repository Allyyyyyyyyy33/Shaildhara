name: Refresh live data
# Every 3 hours: re-reads the live official sources (alerts, river telemetry, IMD if a key is set) and commits web/data/live.
# Live feeds only - this never rebuilds the static data. Each source has a time budget so a run cannot overrun.
#
# ONE-TIME SELF-UPDATE: the first time this file runs it applies the tested SHAILDHARA fixes to the repository
# (files under config/, pipeline/, tests/, web/app.js, web/chain.js, requirements-live.txt) and commits them.
# On every later run that step sees the fixes are already there and does nothing.
on:
  schedule: [{ cron: "15 */3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-live.yml"]
permissions:
  contents: write
concurrency: shaildhara-live
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Apply SHAILDHARA fixes (one time only)
        run: |
          if grep -q "def valid_obs" pipeline/fetch_live.py; then echo "Fixes already present - nothing to apply."; exit 0; fi
          base64 -d <<'PATCH_END' | gunzip > /tmp/fixes.patch
